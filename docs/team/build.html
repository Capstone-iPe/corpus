<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>onb-corpus — build walkthrough</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/site.css" />
</head>
<body>
  <nav class="topnav wrap">
    <a class="topnav-brand" href="../">onb-corpus</a>
    <div class="topnav-links">
      <a href="../">Evaluator</a>
      <a href="./">Team notes</a>
      <a href="build.html" aria-current="page">Build</a>
      <a href="retrieval.html">Retrieval</a>
    </div>
  </nav>

  <main>
    <section id="build" style="border-top:none;padding-top:2rem">
      <div class="wrap">
        <p class="section-kicker">Team · build</p>
        <h2>Seven steps from markdown to index/</h2>
        <p class="section-intro">
          Same path locally and on Render deploy:
          <code>PYTHONPATH=src python -m index build</code>.
          Use the stepper or ← →. Animations replay when you revisit a step.
        </p>
        <div class="stepper">
          <nav class="step-nav" id="step-nav" aria-label="Build steps"></nav>
          <div class="step-stage">
            <div class="stage-head"><h3 id="step-title">Step</h3></div>
            <div class="stage-body">
              <div class="stage-copy" id="step-copy"></div>
              <div class="stage-viz" id="step-viz" aria-live="polite"></div>
            </div>
            <div class="stage-foot">
              <button type="button" class="btn btn-ghost" id="prev-step">← Previous</button>
              <span class="mono" id="step-counter" style="align-self:center;color:var(--mist)"></span>
              <button type="button" class="btn btn-primary" id="next-step">Next →</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <a href="./">← Team hub</a> · <a href="retrieval.html">Retrieval &amp; eval →</a>
    </div>
  </footer>
  <script src="../assets/site.js"></script>
</body>
</html>
