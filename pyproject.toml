[project]
name = "onb-corpus"
version = "0.1.0"
description = "iPe onboarding policy corpus and search API"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "fastapi",
    "uvicorn",
    "python-dotenv",
]

[project.optional-dependencies]
rerank = ["sentence-transformers"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["app", "auth", "chunks", "config", "embed", "index"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
