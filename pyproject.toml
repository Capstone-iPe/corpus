[project]
name = "onb-corpus"
version = "0.1.0"
description = "iPe onboarding policy corpus and search API"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "rank-bm25",
    "fastapi",
    "uvicorn",
    "python-dotenv",
]

[project.optional-dependencies]
rerank = ["sentence-transformers"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
