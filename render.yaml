# Optional Blueprint for Capstone-iPe/onb-corpus.
# Secrets stay sync: false — set them in the Dashboard / MCP.
# Upload Secret File vm02-ca.crt (Render mounts it at /etc/secrets/vm02-ca.crt).

services:
  - type: web
    name: onb-corpus
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt && PYTHONPATH=src python -m onb_corpus build
    startCommand: PYTHONPATH=src python -m onb_corpus serve
    healthCheckPath: /health
    # Free = 512Mi. Do not add sentence-transformers / torch.
    envVars:
      - key: EMBEDDING_MODEL
        value: bge-small-en-v1.5
      - key: EMBEDDINGS_BASE_URL
        value: https://103.42.50.41:1035/v1
      - key: EMBEDDINGS_CA_CERT
        value: /etc/secrets/vm02-ca.crt
      - key: EMBEDDINGS_API_KEY
        sync: false
      - key: CORPUS_API_KEY
        sync: false
